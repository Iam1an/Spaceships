[workspace]
resolver = "2"
members = ["crates/protocol", "crates/sim", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Keep this list small on purpose. `sim` must stay dependency-free (see
# crates/sim/src/lib.rs), and `protocol` only needs serde to describe the
# existing JSON wire format.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

spaceships-protocol = { path = "crates/protocol" }
spaceships-sim = { path = "crates/sim" }

[profile.release]
lto = "thin"
codegen-units = 1
