[package]
name = "spaceships-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

# NOT inherited from the workspace. `sim`, `protocol`, and `server` build on
# 1.85; Bevy 0.19 declares rust-version = "1.95.0", and cargo's MSRV-aware
# resolver will silently pick Bevy 0.16 for this package if it inherits the
# workspace's 1.85. Overriding it here keeps that constraint local to the
# renderer instead of dragging the dependency-free crates forward with it.
rust-version = "1.95"

[dependencies]
# The whole point: the renderer reads the simulation, never the reverse.
spaceships-sim.workspace = true

# Recording and playback. Depends on `sim` and nothing else, so bringing it in
# adds no crate to the graph beyond itself — and the file format it defines is
# hand-rolled for exactly that reason.
spaceships-replay.workspace = true

# The 35 wire messages. Plain serde/JSON, no platform assumptions, so the same
# crate compiles for both transports in `net.rs` without a single `cfg`.
spaceships-protocol.workspace = true
serde_json.workspace = true

# Pinned exactly. Bevy renames core types every release (this crate was written
# against 0.19: `SceneRoot` is `WorldAssetRoot`, `EventReader` is
# `MessageReader`, `shadows_enabled` is `shadow_maps_enabled`), so a caret
# range would be a silent breakage waiting for the next minor bump.
#
# `default-features = false` with a hand-picked list rather than the "3d"
# profile. The default set pulls in 2d, UI, audio, picking, gizmos, gilrs, and
# BSN scenes, all of which cost wasm bytes we cannot spend. Feature names below
# are from bevy 0.19's own docs/cargo_features.md — several changed in 0.18/0.19
# (`zstd` split into `zstd_rust`/`zstd_c`, `bevy_gizmos` split from
# `bevy_gizmos_render`, scene serialization renamed to
# `bevy_world_serialization`).
[dependencies.bevy]
version = "=0.19.0"
default-features = false
features = [
  # -- app / core ----------------------------------------------------------
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "reflect_auto_register",

  # -- windowing -----------------------------------------------------------
  "bevy_window",
  "bevy_winit",

  # -- scene description ---------------------------------------------------
  "bevy_camera",
  "bevy_color",
  "bevy_image",
  "bevy_mesh",
  "bevy_shader",
  "bevy_material",
  "bevy_light",

  # -- renderer ------------------------------------------------------------
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_gltf",
  # Bloom, chromatic aberration, and vignette — the Ultra Graphics pipeline
  # (`public/src/graphics.js`) is the look being matched, and all three are in
  # here. Not free: this is the feature that pulls in the post-process render
  # graph and its shaders.
  "bevy_post_process",
  # `WorldAssetRoot` (ex-`SceneRoot`) lives here; spawning a glTF scene needs
  # it. This is the old scene system, not the new BSN one.
  "bevy_world_serialization",

  # -- HUD -----------------------------------------------------------------
  # `bevy_ui` is the layout engine; `bevy_ui_render` is what actually draws it,
  # and they are separate features in 0.19 — enabling only the former gives you
  # a laid-out tree that renders nothing, with no error. `bevy_ui` pulls
  # `bevy_text` and `bevy_sprite`, `bevy_ui_render` pulls `bevy_sprite_render`;
  # both are named anyway so the dependency is legible at the call site.
  #
  # Note that in 0.19 the `ui` feature is no longer implied by `2d`/`3d`
  # (`_release-content/migration-guides/ui_feature.md`), so a hand-picked list
  # like this one has to ask for it.
  "bevy_ui",
  "bevy_ui_render",
  "bevy_text",
  # The 20 kB embedded FiraMono subset. The JS HUD is Orbitron, fetched from
  # Google Fonts; no TTF ships in `public/`, so there is nothing to load and
  # without this feature `bevy_text` renders *nothing at all* — silently, since
  # a missing font is a `TextError::NoSuchFont` that the text system retries
  # forever rather than reporting. See `HUD_FONT` in `hud.rs` for the swap.
  "default_font",

  # -- audio ---------------------------------------------------------------
  # NOT implied by "3d"; `default-features = false` dropped it. `bevy_audio`
  # brings rodio (cpal on native, WebAudio on wasm) plus AudioPlayer/AudioSink.
  # `mp3` because every file in public/sounds/ is one and nothing else decodes
  # them — it routes through symphonia, pure Rust, builds for wasm unchanged.
  "bevy_audio",
  "mp3",

  # -- image formats -------------------------------------------------------
  # png: the glTF's embedded textures. jpeg: "moon Texture.jpg", for when the
  # moon lands. ktx2+zstd_rust: bevy's own tonemapping LUTs are ktx2/zstd.
  "png",
  "jpeg",
  "ktx2",
  "zstd_rust",
  "tonemapping_luts",
]

# Native only. `multi_threaded` needs real threads; on wasm32 without
# SharedArrayBuffer + COOP/COEP it is a build error, and turning it on would
# also force the COOP/COEP header work described in vite.config.js.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bevy]
version = "=0.19.0"
default-features = false
features = ["multi_threaded"]

# wasm-only. `webgl2` is in bevy's `default_platform` collection, which
# `default-features = false` removed, so it has to be named explicitly or the
# render backend has no browser target at all.
[target.'cfg(target_arch = "wasm32")'.dependencies.bevy]
version = "=0.19.0"
default-features = false
features = ["webgl2"]

# getrandom has no default backend on wasm32-unknown-unknown; something in the
# graph (wgpu -> uuid, and bevy's own asset ids) pulls it in. Needs both this
# feature and `RUSTFLAGS=--cfg getrandom_backend="wasm_js"` at build time — see
# build-wasm.sh. Missing either produces a link error about
# `__getrandom_v03_custom` that reads like a Bevy problem and is not one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", default-features = false, features = ["wasm_js"] }
wasm-bindgen = "=0.2.126"

# ── api.rs, wasm half ────────────────────────────────────────────────────────
# `window.fetch` returns a `Promise`, and a `Promise` has to be awaited; these
# two are what turn it into a future the browser's own microtask queue drives.
# Both are already in the lockfile at these versions (Bevy resolves them), so
# naming them adds no crate to the graph — and, as with wasm-bindgen above, the
# versions *must* match what is already there or build-wasm.sh's schema-hash
# check on the bindgen step fails.
js-sys = "=0.3.103"
wasm-bindgen-futures = "=0.4.76"

# ── net.rs, native half ──────────────────────────────────────────────────────
# The socket runs on one dedicated OS thread with a current-thread tokio
# runtime; see the `native` module in src/net.rs for why it is not on Bevy's
# `IoTaskPool` (tokio-tungstenite needs a tokio reactor in scope, and Bevy's
# executor is `async_executor`, which does not provide one).
#
# All three are `workspace = true` rather than re-pinned here: the server
# already pins tokio `=1.53.1`, tokio-tungstenite `=0.30.0`, and futures-util
# `=0.3.33`, and a second pin in this file is a second thing to forget to bump.
# Cargo's feature unification means the server's feature set is what gets built
# for a workspace-wide `cargo build` regardless of what this crate asks for.
#
# No TLS feature. `default = [connect, handshake]` speaks `ws://` only; `wss://`
# needs `features = ["rustls-tls-webpki-roots"]` and roughly 15 more crates in
# the lockfile. `connect()` in net.rs rejects a `wss://` URL with a message
# naming that line rather than failing inside the handshake. The native build is
# the desktop/dev client and talks to a local server; the browser build reaches
# production, and there the browser owns TLS.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

# ── net.rs, wasm half ────────────────────────────────────────────────────────
# No socket crate: the browser already has one. `web-sys` is a facade over
# `window.WebSocket`, so the whole wasm transport is four `Closure`s and a
# queue, and none of tungstenite's framing, masking, or handshake code is
# compiled at all.
#
# Versions match what Bevy already resolved (wasm-bindgen 0.2.126 / web-sys
# 0.3.103), so this adds no new lockfile entries — and wasm-bindgen in
# particular *must* match, because build-wasm.sh checks the CLI against the
# lockfile and a mismatched schema hash fails the bindgen step.

# (A second, identical `getrandom` line used to sit here. It was below the
# *native* table header rather than the wasm one, so it added a wasm-only
# dependency to every desktop build — silently, because the `wasm_js` feature
# compiles to nothing off the web. The real one is up beside `wasm-bindgen`.)

# Every DOM type net.rs and api.rs touch, named explicitly — web-sys gates all
# 1700+ of its bindings behind features and compiles only what is asked for.
# `Window`/`Location`/`Storage` are for deriving the socket URL, the REST base,
# and the JWT from the page the way `public/src/lobby/net.js` does.
# `Headers`/`Request`/`RequestInit`/`RequestMode`/`Response` are `api.rs`'s
# whole transport.
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "=0.3.103"
features = [
  "BinaryType",
  "CloseEvent",
  "ErrorEvent",
  "Event",
  "Headers",
  "Location",
  "MessageEvent",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Storage",
  "WebSocket",
  "Window",
]
